{% extends "base.html" %}
{% block title %}Rename {{ deck.title }} · Nexora Notebook{% endblock %}
{% block back %}<a class="back-link" href="{{ url_for('decks.deck_page', deck_id=deck.id) }}">← Back</a>{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Rename deck</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {% for field in [form.title] %}
      {% include "_form_field.html" %}
    {% endfor %}
    <div class="actions">
      <button type="submit" class="button button-primary">Save name</button>
      <a class="button" href="{{ url_for('decks.deck_page', deck_id=deck.id) }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
